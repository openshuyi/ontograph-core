name: Release

# Versioned release: pushing a `v*` tag publishes the package as `latest`.
# The tag must match package.json version exactly (e.g. tag v0.1.0 ↔ version 0.1.0).

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-npm:
    # Forks have no NPM_TOKEN; never attempt to publish there.
    if: github.repository == 'openshuyi/ontograph-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test

      - run: bun run build

      - name: Verify dist output
        run: test -d dist && echo "dist/ produced successfully" || (echo "dist/ missing" && exit 1)

      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - run: npm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
