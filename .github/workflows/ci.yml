name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test --coverage

      - name: Coverage summary
        if: always()
        run: cat coverage/coverage-summary.txt 2>/dev/null || echo "Coverage report not found"

      - run: bun run build

      - name: Verify dist output
        run: test -d dist && echo "dist/ produced successfully" || (echo "dist/ missing" && exit 1)
